name: Build PURPLE HAZE Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "main.py"
      - "buildozer.spec"
      - "requirements.txt"
      - ".github/workflows/purple-haze-android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linux build dependencies
        run: |
          # GitHub-hosted runners can occasionally lose DNS access to Ubuntu mirrors.
          # Retry the index refresh and package download before failing the build.
          for attempt in 1 2 3 4 5; do
            if sudo apt-get -o Acquire::Retries=3 update; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "Ubuntu package index refresh failed after 5 attempts."
              exit 1
            fi
            sleep 20
          done
          for attempt in 1 2 3 4 5; do
            if sudo apt-get -o Acquire::Retries=3 install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "Linux build dependency installation failed after 5 attempts."
              exit 1
            fi
            sleep 20
          done
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36
      - name: Check Python syntax
        run: python -m py_compile main.py
      - name: Build debug APK (Android compatibility fallback)
        shell: bash
        run: |
          set +e
          buildozer android debug
          build_status=$?
          set -e
          if [ "$build_status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          import shutil
          import sys

          root = Path(".buildozer")
          grp_files = list(root.glob("**/python3/Modules/grpmodule.c"))
          if not grp_files:
              sys.exit("CPython grpmodule.c not found; cannot apply Android compatibility patch.")

          for path in grp_files:
              source = path.read_text()
              marker = "grp_getgrall_impl"
              pos = source.find(marker)
              if pos < 0:
                  sys.exit(f"{marker} not found in {path}")
              start = source.rfind("static PyObject *", 0, pos)
              brace = source.find("{", pos)
              depth = 0
              finish = -1
              for i in range(brace, len(source)):
                  if source[i] == "{":
                      depth += 1
                  elif source[i] == "}":
                      depth -= 1
                      if depth == 0:
                          finish = i + 1
                          break
              if start < 0 or brace < 0 or finish < 0:
                  sys.exit(f"Could not safely locate {marker} body in {path}")
              if "__ANDROID__" not in source[start:finish]:
                  body = source[brace + 1:finish - 1]
                  replacement = (source[start:brace + 1]
                      + "\n#ifdef __ANDROID__\n"
                      + "    /* Android bionic does not expose getgrent APIs. */\n"
                      + "    return PyList_New(0);\n"
                      + "#else" + body + "\n#endif\n}")
                  path.write_text(source[:start] + replacement + source[finish:])
                  print("Patched Android grp compatibility:", path)

          # Patch pygame's stale CPython private-header include, if pygame
          # source has already been unpacked by the first build attempt.
          for path in root.glob("**/src_c/_sdl2/sdl2.c"):
              source = path.read_text()
              updated = source.replace('#include "longintrepr.h"',
                                       '#include "cpython/longintrepr.h"')
              if updated != source:
                  path.write_text(updated)
                  print("Patched pygame Python 3.12 header:", path)

          # Force CPython to rebuild after its first failed compile.
          for path in grp_files:
              android_build = path.parent.parent / "android-build"
              if android_build.is_dir():
                  for lib in android_build.glob("libpython*.so"):
                      lib.unlink()
                      print("Removed incomplete build marker:", lib)
                  install_root = android_build / "android-root"
                  if install_root.exists():
                      shutil.rmtree(install_root)
                      print("Removed incomplete install tree:", install_root)
          PY
            buildozer android debug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: purple-haze-debug-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Publish APK as a GitHub Release asset
        if: github.ref == 'refs/heads/fix/python310-pygame-android' || github.ref == 'refs/heads/fix/publish-apk-release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: purple-haze-build-${{ github.run_number }}
          name: PURPLE HAZE Android build ${{ github.run_number }}
          files: bin/*.apk
          prerelease: true
